{% set python_min = '3.10' %}
{% set name = "xstac" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/xstac-{{ version }}.tar.gz
  sha256: 5c2f5973ca3430ff44090ea724d3d2224f2549d5bb7f03c142b2dcea407fd712

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1
  entry_points:
    - xstac = xstac._generate:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core >=2,<4
  run:
    - python >={{ python_min }}
    - cf_xarray
    - xarray
    - numpy
    - pystac >=1.0.0b3
    - pandas
    - pyproj
    - pydantic
    - zarr
    - jsonschema
    - dask-core
    # fsspec[http]
    - fsspec
    - requests
    - aiohttp !=4.0.0a0,!=4.0.0a1

test:
  imports:
    - xstac
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/xstac/
  summary: xstac
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
